<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>网易云音乐互助 · v5.1</title>
<style>
  :root { --red:#EC4141; --t1:#333; --t2:#999; --line:#E5E5E5; --ok:#2ea44f; --track:#F1F2F6; }
  body { font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; width:280px; margin:0; color:var(--t1); font-size:13px; }
  header { display:flex; align-items:center; gap:8px; padding:12px 14px; border-bottom:1px solid var(--line); font-weight:600; }
  header .dot { width:8px; height:8px; border-radius:50%; background:var(--ok); box-shadow:0 0 0 3px rgba(46,164,79,.12); flex:none; }
  header .dot.off { background:var(--t2); box-shadow:none; }
  .sp { flex:1; }
  .badge { font-size:10.5px; padding:2px 8px; border-radius:9px; background:var(--track); color:var(--t2); white-space:nowrap; }
  .badge.g { background:#e8f6ec; color:var(--ok); }
  main { padding:12px 14px; }
  .pt-row { display:flex; justify-content:space-between; align-items:center; padding:5px 0; font-size:12px; }
  .pt-row .k { color:var(--t2); }
  .pt-row b { color:var(--t1); font-variant-numeric:tabular-nums; }
  .hidden { display:none; }
  .btn { display:block; width:100%; margin-top:9px; padding:9px 0; border:none; border-radius:9px; background:var(--red); color:#fff; font-size:13px; font-weight:600; cursor:pointer; text-align:center; }
  .btn.ghost { background:#fff; color:var(--red); border:1px solid var(--red); margin-top:7px; font-weight:500; }
  .btn.dim { background:var(--track); color:var(--t1); margin-top:7px; font-weight:500; }
  .btn:disabled { opacity:.5; cursor:default; }
  .place { padding:8px 0 2px; font-size:12px; color:var(--t2); }
  footer { padding:9px 14px 11px; font-size:10.5px; color:var(--t2); line-height:1.6; border-top:1px solid var(--line); }
</style>
<script src="popup.js" defer></script>
</head>
<body>
  <header>
    <span class="dot off" id="dot"></span>
    网易云音乐互助 · v5.1
    <span class="sp"></span>
    <span class="badge" id="badge">未同步</span>
  </header>
  <main>
    <div id="stateA">
      <div class="pt-row"><span class="k">今日帮听</span><b id="today">—</b></div>
      <div class="pt-row"><span class="k">当前任务</span><b id="task">—</b></div>
      <div class="pt-row"><span class="k">被帮助</span><b id="helped">—</b></div>
    </div>
    <div id="stateB" class="hidden">
      <div class="place">打开网易云页面后，面板自动运行，这里会同步实时状态。</div>
    </div>
    <button class="btn" id="open">打开互助页面</button>
    <button class="btn ghost" id="copy">复制诊断信息</button>
    <button class="btn dim" id="toggle">展开面板 / 隐藏面板</button>
  </main>
  <footer>面板已常驻页面右上角（默认始终展开，可在设置开启 5 分钟自动收起）</footer>
</body>
</html>
